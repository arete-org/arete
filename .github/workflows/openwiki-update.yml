name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # Batch changes daily to conserve the free router's request quota (UTC).
    - cron: "23 5 * * *"

permissions:
  contents: write
  pull-requests: write

# Both triggers maintain the same PR; never interrupt a run halfway through it.
concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check provider credentials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "::error::Add the repository Actions secret OPENROUTER_API_KEY."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          # OpenWiki compares source evidence with its last documented commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Record the documented source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.22.0"

      - name: Test the provider transport
        run: node --test scripts/openwiki/transport.test.mjs

      - name: Install OpenWiki
        timeout-minutes: 5
        # Resolve dependencies as of this OpenWiki release: newer AWS SDK
        # packages currently require credential-provider-env versions absent
        # from npm. Advance the cutoff only after a clean installation test.
        run: npm install --global --before=2026-10-07T00:00:00Z openwiki@0.7.1

      - name: Restore OpenWiki progress for this source revision
        id: progress
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: openwiki/
          key: openwiki-v1-${{ steps.source.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openwiki-v1-${{ steps.source.outputs.sha }}-

      - name: Update the wiki
        id: generate
        timeout-minutes: 25
        # --update also bootstraps a missing wiki. Failed runs must not publish
        # partial pages or advance the successful-update metadata.
        run: openwiki code --update --print
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/scripts/openwiki/preload.mjs
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_PROVIDER: openrouter
          OPENWIKI_MODEL_ID: openrouter/free
          OPENWIKI_MAX_OUTPUT_TOKENS: "8192"
          OPENWIKI_PAGE_CONCURRENCY: "1"
          OPENWIKI_PROVIDER_RETRY_ATTEMPTS: "1"
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Verify OpenWiki completed the run
        id: complete
        # Do not treat an exit code alone as proof that every page completed.
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          const state = JSON.parse(readFileSync('openwiki/.last-update.json', 'utf8'));
          assert.equal(state.status, 'complete', 'OpenWiki metadata is incomplete');
          assert(!existsSync('openwiki/.run.json'), 'OpenWiki still has a pending checkpoint');
          JS

      - name: Preserve progress for the next scheduled or manual attempt
        # OpenWiki owns resumable page checkpoints. Cache only wiki state from
        # this exact source revision, never credentials or the whole checkout.
        if: >-
          !cancelled() && steps.progress.outputs.cache-primary-key != '' &&
          (steps.generate.outcome == 'success' || steps.generate.outcome == 'failure') &&
          hashFiles('openwiki/.last-update.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: openwiki/
          key: ${{ steps.progress.outputs.cache-primary-key }}

      - name: Explain an interrupted generation
        if: failure() && (steps.generate.outcome == 'failure' || steps.complete.outcome == 'failure')
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          OpenWiki did not complete; no documentation PR was published by this run.

          Provider requests are paced and transient failures have bounded retries.
          Check the `OpenWiki HTTP` lines for attempt counts and the terminal error
          for exhausted quota, persistent provider failures or an exceeded budget.
          Available wiki checkpoints are cached for the same source commit so a
          later scheduled/manual run can resume completed pages. Cache retention
          is best-effort; an empty or evicted cache starts a fresh generation.
          EOF

      - name: Check for documentation changes
        id: changes
        run: |
          rm -f -- openwiki/.run.json.*.tmp
          # A freshness timestamp or source fingerprint alone is not a docs PR.
          changes=$(git status --porcelain --untracked-files=all -- \
            openwiki AGENTS.md CLAUDE.md \
            ':!openwiki/.last-update.json' ':!openwiki/.page-manifest.json')
          if [[ -n "$changes" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the documentation pull request
        if: steps.changes.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          base: main
          branch: openwiki/update
          # Include grounding and freshness metadata with substantive changes;
          # never publish application or workflow edits from the model.
          add-paths: |
            openwiki/
            AGENTS.md
            CLAUDE.md
          commit-message: |
            docs: refresh the OpenWiki reference

            Keep repository context aligned with the current source so agents
            can find implementation facts and their evidence without rediscovery.
          title: "docs: refresh the OpenWiki reference"
          body: |
            Refresh the repository wiki and its source-grounded claims using
            OpenWiki 0.7.1 with OpenRouter's `openrouter/free` model router.

            Review the generated claims and source references. Approve the CI
            workflows from the PR merge box so the required checks can run.

            Generated by the [OpenWiki workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

      - name: Enable merge after required checks
        if: steps.pr.outputs.pull-request-number != ''
        # Request auto-merge explicitly: `gh pr merge --auto` can merge
        # immediately when branch protection has no required checks.
        run: |
          pr_id=$(gh pr view "$PR_URL" --json id --jq .id)
          gh api graphql -f pullRequestId="$pr_id" -f query='
            mutation($pullRequestId: ID!) {
              enablePullRequestAutoMerge(input: {
                pullRequestId: $pullRequestId, mergeMethod: MERGE
              }) { pullRequest { number } }
            }'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
