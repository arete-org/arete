name: CI

on:
  # PRs already check the merge result: branch pushes must not duplicate them.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled`: adding the `preview` label deploys the PR's preview.
    types: [opened, synchronize, reopened, labeled]
  # The merge queue checks each entry merged onto main before it lands.
  merge_group:
  # Full verification remains available before opening a PR.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its run in flight. A main run completes: the
# "Deploy preview" workflow follows it (workflow_run) and needs its verdict.
# A label leaves the commit unchanged, so its run queues behind the one in
# flight instead: a run cancelled mid-flight leaves its required checks
# CANCELLED on the commit, and GitHub may then block the PR although a later
# run passed. A queued run replaced by a newer one never starts and leaves no
# check. Dependabot opens its PRs without labels (`dependabot.yml`).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      preview: ${{ steps.select.outputs.preview }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # PR: merge commit's first parent. Push: the event's entire range,
          # including multi-commit pushes; never infer it from HEAD^ alone.
          fetch-depth: 0
      - name: Test CI selection policy
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Check GitHub Actions are pinned to a commit SHA
        run: python3 scripts/ci/check_action_pins.py
      - name: Select affected checks
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == merge_group ]]; then
            mode=(--base HEAD^1)
          elif [[ "$EVENT_NAME" == push && "$PUSH_BASE" != 0000000000000000000000000000000000000000 ]]; then
            mode=(--base "$PUSH_BASE" --full-tests)
          else
            mode=(--all)
          fi
          python3 scripts/ci/select_checks.py "${mode[@]}" \
            --plan .context/ci-plan.json --summary "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-plan
          path: .context/ci-plan.json
          include-hidden-files: true
          retention-days: 14
          overwrite: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: steps.select.outputs.backend == 'true'
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.12
        if: steps.select.outputs.backend == 'true'
      - run: uv sync --frozen --extra dev
        if: steps.select.outputs.backend == 'true'
      - run: uv run ruff check src tests scripts/ci
        if: steps.select.outputs.backend == 'true'
      - run: uv run ruff format --check src tests scripts/ci
        if: steps.select.outputs.backend == 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.select.outputs.transport == 'true'
        with:
          node-version: "22.22.0"
      - run: node --test scripts/openwiki/transport.test.mjs
        if: steps.select.outputs.transport == 'true'

  # The full suite took 14m49s in one job on 2026-10-17 (2 vCPU, 2 workers):
  # three shards of whole files, balanced on scripts/ci/test_durations.json.
  test-shard:
    # The matrix is the only shard count: K/N comes from it.
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint
    if: needs.lint.outputs.backend == 'true'
    strategy:
      # Every shard reports: one failure must not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-plan
          path: .context
      # A narrow change selects few files: an empty shard skips the setup.
      - name: Count this shard's files
        id: shard
        run: >-
          python3 scripts/ci/check_changed.py --plan .context/ci-plan.json
          --shard "$SHARD" --count-only >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: steps.shard.outputs.files != '0'
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.12
        if: steps.shard.outputs.files != '0'
      - run: uv sync --frozen --extra dev
        if: steps.shard.outputs.files != '0'
      - run: python3 scripts/bundle_ocr_data.py
        if: steps.shard.outputs.files != '0'
      # Two bounded workers, each with its own temporary DuckDB from conftest.
      # Keep each file together to preserve module fixtures and test ordering.
      - run: >-
          python3 scripts/ci/check_changed.py --plan .context/ci-plan.json --run
          --tests-only --shard "$SHARD"
        if: steps.shard.outputs.files != '0'

  # The required check: green only when every shard passed, skipped with them
  # when the backend is not selected. always(), not !cancelled(): a cancelled
  # run must fail this check, since GitHub counts a skipped required check as
  # passed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test-shard]
    if: ${{ always() && needs.lint.outputs.backend == 'true' }}
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          echo "Shards: $SHARDS"
          [[ "$SHARDS" == success ]]

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint
    if: needs.lint.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py312-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py312-${{ hashFiles('uv.lock', 'pyproject.toml') }}-
      - run: uv run mypy src/arete

  frontend:
    runs-on: ubuntu-latest
    needs: lint
    if: needs.lint.outputs.frontend == 'true'
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright browsers and system dependencies
        timeout-minutes: 8
        # The Azure mirror can trickle packages for the entire job timeout.
        # Keep the runner's official Ubuntu archive and security fallbacks.
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps chromium webkit
      # Planning E2E starts the real API against a disposable DuckDB database.
      # Jobs have separate filesystems: the backend job's .venv is not available here.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
        working-directory: .
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chiron-chart-previews
          path: .context/chiron-chart-*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unified-experience-previews
          path: |
            .context/arete-*.png
            .context/planning-a-*.png
            .context/briefing-*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures
          path: .context/browser-results
          include-hidden-files: true

  # Previews deploy here, once every affected check above is green, and only
  # for a PR labelled `preview`: each deployment stores a ~430 MB function
  # against the plan's 10 GB. Vercel's Git integration deploys nothing
  # (`git.deploymentEnabled` in vercel.json); main goes to Preview through the
  # "Deploy preview" workflow and production through "Deploy production". A
  # pull_request run checks out the merge of the branch into main, so the
  # preview is what merging would ship; a conflicting branch has no merge
  # commit, no run, no preview.
  preview:
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      needs.lint.result == 'success' && needs.lint.outputs.preview == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    needs: [lint, test, typecheck, frontend]
    # Closing a PR must wait for its deployment before deleting its preview.
    concurrency:
      group: pr-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm install --global vercel@63.1.2
      - name: Deploy the preview
        id: deploy
        run: |
          # Cleanup may have finished while this job was waiting for CI.
          state=$(gh pr view "$PR" --json state --jq .state)
          case "$state" in
            OPEN) ;;
            CLOSED|MERGED) echo "PR $PR is closed; skipping preview."; exit 0 ;;
            *) echo "Unexpected PR state: $state" >&2; exit 1 ;;
          esac
          url=$(vercel deploy --archive=tgz --yes --token "$VERCEL_TOKEN" --meta pr="$PR")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
      - name: Remove the PR's superseded previews
        if: steps.deploy.outputs.url != ''
        run: scripts/ci/prune_deployments.sh 1 meta-pr="$PR"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
      - name: Link the preview on the pull request
        if: steps.deploy.outputs.url != ''
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body \
            "Preview de ${SHA::7} (branche fusionnée dans main) : $URL"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.url }}
