name: Deploy preview

# main ships to the Preview environment (its own database, `md:arete_preview`)
# on a fixed URL once CI is green, so merged work runs somewhere before a batch
# goes to production. It is its own workflow so that a failed deployment never
# shows as a failed CI run, and so that "Deploy production" can ask one thing:
# did this application's inputs reach the preview healthy? Documentation-only
# merges retain the previous healthy preview. Only the newest preview is kept.
on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "Diagnose an existing preview (Vercel URL or deployment ID); deploys nothing"
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-preview
  cancel-in-progress: false

# `bash` adds -o pipefail: a health check piped into tee must fail the job.
defaults:
  run:
    shell: bash

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      # Resolve through Vercel before sending the bypass key to a supplied URL.
      - name: Resolve a preview belonging to this project
        id: resolve
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment=${DEPLOYMENT#https://}
          if [[ ! "$deployment" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo 'Expected a Vercel deployment ID or hostname.' >&2
            exit 1
          fi
          url=$(curl -fsS --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$deployment?teamId=$VERCEL_ORG_ID" \
            | jq -er --arg project "$VERCEL_PROJECT_ID" \
              'select(.projectId == $project and .target != "production") | .url | select(type == "string" and length > 0)')
          echo "url=https://$url" >> "$GITHUB_OUTPUT"
      - name: Capture startup logs while reading health
        if: always() && !cancelled() && steps.resolve.outputs.url != ''
        timeout-minutes: 3
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          URL: ${{ steps.resolve.outputs.url }}
        run: bash scripts/ci/preview_logs.sh

  select:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      preview: ${{ steps.plan.outputs.preview }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Read the verified deployment decision
        id: plan
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path("plan/ci-plan.json").read_text())
          assert plan["head"] == os.environ["EXPECTED_SHA"], "CI plan belongs to another commit"
          assert type(plan["preview"]) is bool, "Missing deployment decision"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"preview={str(plan['preview']).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("Application changed: deploy preview.\n" if plan["preview"] else "No deployable change: keep the healthy preview.\n")
          PY

  deploy:
    needs: select
    if: needs.select.outputs.preview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shown as "Preview" in the repository's Deployments, with the fixed URL.
    environment:
      name: Preview
      url: https://arete-main-arete15.vercel.app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      MAIN_PREVIEW_ALIAS: arete-main-arete15.vercel.app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --global vercel@63.1.2
      # `sha` lets "Deploy production" ask Vercel which commit the fixed URL serves.
      - name: Deploy main to Preview
        id: deploy
        run: |
          url=$(vercel deploy --archive=tgz --yes --token "$VERCEL_TOKEN" \
            --meta channel=main --meta sha="$SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
      # The first request migrates `arete_preview`; /health answers 503 while a
      # migration is pending or failed, so a broken migration stops here, on the
      # preview database: the fixed URL keeps serving the previous build and this
      # run stays red until it is fixed.
      - name: Check the health of the deployment
        id: health
        run: |
          # Preserve the JSON explaining a 503, while still failing the job.
          curl --fail-with-body -sS --connect-timeout 10 --max-time 60 \
            --retry 5 --retry-delay 10 --retry-all-errors --retry-max-time 300 \
            -H "x-vercel-protection-bypass: $BYPASS" \
            "$URL/api/health" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          URL: ${{ steps.deploy.outputs.url }}
      # A missing migration is only the symptom: its startup error is in Vercel.
      - name: Show runtime errors when the health check fails
        if: failure() && steps.health.outcome == 'failure'
        timeout-minutes: 2
        run: bash scripts/ci/preview_logs.sh
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
      # REST, as `vercel alias set` cannot resolve `--scope` with the token.
      - name: Point the fixed URL at it
        run: |
          api=https://api.vercel.com
          id=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$api/v13/deployments/${URL#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          curl -fsS -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"alias\":\"$MAIN_PREVIEW_ALIAS\"}" \
            "$api/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID" > /dev/null
          echo "https://$MAIN_PREVIEW_ALIAS now serves $URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
      - name: Remove the superseded main previews
        run: scripts/ci/prune_deployments.sh 1 meta-channel=main
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
