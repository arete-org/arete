name: Deploy production

# Production ships by hand, in batches, rather than on every merge into main:
# each deployment stores a ~430 MB function against the plan's 10 GB. Anyone
# with write access runs it. The guard is not a reviewer but the preview: the
# application must already run healthy at https://arete-main-arete15.vercel.app,
# migrations included. Non-deployable commits may follow its tagged SHA.
# The first request migrates the real database after cloning it
# (docs/deployment.md, "Migrations"); the domain moves only onto a healthy build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

# `bash` adds -o pipefail: a health check piped into tee must fail the job.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Shown as "Production" in the repository's Deployments.
    environment:
      name: Production
      url: https://arete-arete15.vercel.app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: https://arete-arete15.vercel.app
      MAIN_PREVIEW_ALIAS: arete-main-arete15.vercel.app
    steps:
      - uses: actions/checkout@v5
        with:
          # Equivalence requires ancestry and the full diff from the serving SHA.
          fetch-depth: 0
      - name: Require a healthy preview of the same application
        run: |
          serving=$(curl -fsS --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$MAIN_PREVIEW_ALIAS?teamId=$VERCEL_ORG_ID" \
            | jq -er 'select(.readyState == "READY") | .meta.sha | select(type == "string" and length > 0)')
          python3 scripts/ci/deployment_guard.py --preview-sha "$serving" | tee -a "$GITHUB_STEP_SUMMARY"
          curl --fail-with-body -sS --connect-timeout 10 --max-time 60 \
            -H "x-vercel-protection-bypass: $BYPASS" \
            "https://$MAIN_PREVIEW_ALIAS/api/health" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --global vercel@63.1.2
      # `--skip-domain`: the build gets no traffic until it answers healthy.
      # Moving the domain first served a broken release, and after a rollback
      # Vercel no longer moves it, so the check read the old one (2026-10-13).
      - name: Deploy main to production
        id: deploy
        run: |
          url=$(vercel deploy --prod --skip-domain --archive=tgz --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # The first request runs any pending migration after cloning the database;
      # /health answers 503 until the schema is current. The live release keeps
      # serving meanwhile: a migration keeps the previous release working.
      - name: Check the health of the deployment
        run: |
          # Preserve the JSON explaining a 503, while still failing the job.
          curl --fail-with-body -sS --connect-timeout 10 --max-time 60 \
            --retry 5 --retry-delay 10 --retry-all-errors --retry-max-time 300 \
            -H "x-vercel-protection-bypass: $BYPASS" \
            "$URL/api/health" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          URL: ${{ steps.deploy.outputs.url }}
      # REST, as the CLI cannot resolve `--scope` with the token. Promoting also
      # restores the automatic domain assignment a rollback disables.
      - name: Promote it and check production serves it
        run: |
          api=https://api.vercel.com
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")
          id=$(curl -fsS "${auth[@]}" \
            "$api/v13/deployments/${URL#https://}?teamId=$VERCEL_ORG_ID" | jq -er .id)
          curl -fsS -X POST "${auth[@]}" \
            "$api/v10/projects/$VERCEL_PROJECT_ID/promote/$id?teamId=$VERCEL_ORG_ID" > /dev/null
          for _ in $(seq 1 30); do
            serving=$(curl -fsS "${auth[@]}" \
              "$api/v13/deployments/${PRODUCTION_URL#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
            [[ "$serving" == "$id" ]] && break
            sleep 5
          done
          if [[ "$serving" != "$id" ]]; then
            echo "$PRODUCTION_URL serves $serving, not $id ($URL)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          curl --fail-with-body -sS --connect-timeout 10 --max-time 60 \
            --retry 5 --retry-delay 10 --retry-all-errors --retry-max-time 300 \
            "$PRODUCTION_URL/api/health" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
      # The live deployment and the previous one, for an instant rollback.
      - name: Keep the two newest production deployments
        run: scripts/ci/prune_deployments.sh 2 target=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
