<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F3ED" />
    <script>
      // Before the first paint, the theme initializeTheme() (src/lib/theme.ts) will
      // apply, so a dark palette never flashes cream; theme.test.ts pins that both agree.
      (function () {
        var colors = { pierre: '#F6F3ED', prune: '#291E29', odyssey: '#F5EBDD', encre: '#0E1413' };
        var retired = { light: 'pierre', performance: 'pierre', dark: 'encre', darker: 'encre', abyss: 'encre' };
        var saved = null;
        try { saved = localStorage.getItem('arete.theme.v1'); } catch (error) { /* storage blocked */ }
        var theme = Object.prototype.hasOwnProperty.call(retired, saved) ? retired[saved] : saved;
        if (!Object.prototype.hasOwnProperty.call(colors, theme)) {
          var dark = !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = dark ? 'encre' : 'pierre';
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[theme]);
      })();
    </script>
    <meta name="description" content="Arete - Intelligent training assistant powered by AI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Arete</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
