[project]
name = "arete"
version = "0.1.0"
description = "Training assistant: Garmin analytics, strength log and LLM coaching tips"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.14.2",
    "clerk-backend-api>=7.0",
    "deepagents==0.7.32",
    "duckdb>=1.4.2",
    "fastapi>=0.119.0",
    "fitparse>=1.2.0",
    "garminconnect==0.3.17",
    "httpx>=0.28.0",
    "langchain==1.4.7",
    "langchain-core==1.7.0",
    "langgraph==1.2.16",
    "jsonschema>=4.23",
    "langchain-openai==1.7.2",
    "langsmith==0.14.12",
    "lark>=1.3.1",
    "numpy>=2.3.5",
    "openai==3.37.0",
    "openpyxl>=3.1.5,<4",
    "pillow>=11,<13",
    "pydantic>=2",
    "pypdfium2==5.14.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "pywebpush>=2.0",
    "rank-bm25==0.2.2",
    "rapidfuzz>=3.14.6",
    "regex>=2024.11.6",
    "tesserocr==2.11.0",
    "text2num>=3.1.0",
    "urllib3>=2.8.0",
    "uvicorn>=0.37.0",
    "xlrd>=2.0.2,<3",
    "pytz>=2025.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arete"]

[project.optional-dependencies]
dev = [
    "mypy>=1.19.0",
    "pypdf>=6.21.2,<7",
    "pytest>=9.0.3",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.14.7,<0.15",
]
mcp = [
    "mcp>=2.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function call in default argument (FastAPI pattern: Query, File, Depends)
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
