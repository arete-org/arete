services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: arete-backend
    env_file:
      - .env
      # MOTHERDUCK_TOKEN, pulled by `vercel env pull`
      - path: .env.local
        required: false
    environment:
      # Same MotherDuck database as the Vercel deployment: one source of truth.
      # The daily sync runs there (Vercel Cron), so none is scheduled here.
      - ARETE_DB=md:arete_v2
      # Atomically share automation claims with the Vercel cron windows.
      - ARETE_AUTOMATION_WORKER=true
      # Files beside the database stay on the host and are mirrored into it.
      - ARETE_DATA_DIR=/app/data
      # The frontend container is published on 3080 (overrides .env for Docker)
      - FRONTEND_URL=http://localhost:3080
      - TZ=Europe/Paris
      # Ollama running on the Docker host (default). Switch to
      # http://ollama:11434/v1 when enabling the ollama service below.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Same data directory as the dev setup: DuckDB file, Garmin tokens, FIT files
      - ./data:/app/data
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: arete-frontend
    ports:
      - "3080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Uncomment to run Ollama as a Docker service:
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: arete-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   restart: unless-stopped

